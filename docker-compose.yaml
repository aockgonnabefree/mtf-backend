version: '3.8'

services:
  db:
    image: postgres:16
    container_name: mtf-postgres-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: mtf-backend
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_DB_URL: ${APP_DB_URL_DOCKER}
      APP_DB_USER: ${APP_DB_USER_DOCKER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD_DOCKER}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED}

volumes:
  postgres_data:
